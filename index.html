<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDEA VIVA</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f5ff;
      color: #202b50;
      text-align: center;
      padding: 30px 15px;
    }

    .contenedor {
      max-width: 500px;
      margin: 40px auto;
      padding: 25px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 4px 15px #00000015;
    }

    h1 {
      color: #4659c9;
      font-size: 36px;
    }

    input {
      width: 90%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      margin-top: 15px;
      padding: 13px 25px;
      background: #4659c9;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
    }

    #resultado {
      margin-top: 20px;
      font-size: 16px;
    }
  </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- ACCESO A IDEA VIVA -->
<div id="pantalla-acceso" class="pantalla-acceso">
  <div class="caja-acceso">
    <h1>🧠 IDEA VIVA</h1>
    <h2>Bienvenido a tu espacio inteligente</h2>

    <input type="text" id="nombre-usuario"
      placeholder="Tu nombre">

    <input type="email" id="correo-usuario"
      placeholder="Tu correo electrónico">

    <input type="password" id="clave-usuario"
      placeholder="Tu contraseña">

    <button onclick="registrarUsuario()">
      Crear mi cuenta
    </button>

    <button onclick="iniciarSesion()">
      Iniciar sesión
    </button>

    <p id="mensaje-acceso"></p>
  </div>
</div>
<div class="app-layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">✦</div>
      <h2>IDEA VIVA</h2>
    </div>

    <p class="menu-label">MENÚ PRINCIPAL</p>

    <button class="nav-item active" onclick="mostrar('inicio', this)">⌂ Inicio</button>
    <button class="nav-item" onclick="mostrar('investigacion', this)">⌕ Investigación</button>
    <button class="nav-item" onclick="mostrar('ia', this)">✧ IA inteligente</button>
    <button class="nav-item" onclick="mostrar('creatividad', this)">✎ Creatividad</button>
    <button class="nav-item" onclick="mostrar('videos', this)">▷ Vídeos</button>
    <button class="nav-item" onclick="mostrar('aprendizaje', this)">▤ Aprendizaje</button>
    <button class="nav-item" onclick="mostrar('proyectos', this)">◇ Proyectos</button>

    <div class="sidebar-bottom">
      <button class="nav-item" onclick="cerrarSesionUsuario()">
  🚪 Cerrar sesión
      </button>
      <button class="nav-item" onclick="mostrar('configuracion', this)">⚙ Configuración</button>
    </div>
  </aside>

  <main class="main-content">
    <section id="proyectos" class="workspace hidden">
  <h1>💡 Mis proyectos</h1>
  <p>Guarda y organiza tus ideas.</p>

  <input
    type="text"
    id="nombre-proyecto"
    placeholder="Nombre de tu proyecto"
  >

  <textarea
    id="contenido-proyecto"
    placeholder="Escribe aquí tu idea..."
  ></textarea>

  <button onclick="guardarProyecto(
    document.getElementById('nombre-proyecto').value,
    document.getElementById('contenido-proyecto').value
  )">
    💾 Guardar proyecto
  </button>
    </section>
<header class="contenedor">
  <h1>IDEA VIVA</h1>
  <p class="subtitulo">
    Tu universo de inteligencia artificial
  </p>

  <input
    type="text"
    id="busqueda"
    placeholder="¿Qué deseas descubrir hoy?"
  >

  <button onclick="buscar()">Explorar</button>

  <div id="resultado"></div>
<section class="tarjetas">

  <button class="tarjeta" onclick="abrirHerramienta('investigacion')">
    🔎 Investigación
    <p>Explorar información</p>
  </button>

  <button class="tarjeta" onclick="abrirHerramienta('ia')">
    🧠 IA inteligente
    <p>Conversar con IA</p>
  </button>

  <button class="tarjeta" onclick="abrirHerramienta('creatividad')">
    🎨 Creatividad
    <p>Crear imágenes</p>
  </button>

  <button class="tarjeta" onclick="abrirHerramienta('videos')">
    🎬 Vídeos
    <p>Crear contenido</p>
  </button>

  <button class="tarjeta" onclick="abrirHerramienta('aprendizaje')">
    📚 Aprendizaje
    <p>Aprender y practicar</p>
  </button>

  <button class="tarjeta" onclick="abrirHerramienta('proyectos')">
    💡 Proyectos
    <p>Desarrollar ideas</p>
  </button>

</section>

<section id="panel-herramienta" class="tarjeta" style="display:none;">
</section>
</header>
  </main>
</div>
<link rel="stylesheet" href="style.css">
<script src="script.js"></script>
  <div id="notificacion-idea-viva" class="notificacion">
  IDEA VIVA · Tu espacio inteligente
  </div>
</body>
</html>
